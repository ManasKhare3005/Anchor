<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riverbank | Services</title>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; color: #12202e; }
  .rb-header { padding: 12px 40px; border-bottom: 3px solid #1c7c8c; }
  .svc { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 24px 40px; }
  .svc-card { border: 1px solid #ccd; border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
<header class="rb-header"><a class="rb-logo" href="/">Riverbank</a></header>
<main>
  <h1>Services</h1>
  <div class="svc">
    <div class="svc-card">
      <h2>Deposits</h2>
      <p>Deposit a check from home with your phone or computer.</p>
      <a class="svc-cta" href="/services/mobile-deposit">Deposit a check</a>
    </div>
    <div class="svc-card">
      <h2>Checks</h2>
      <p>Checkbooks are no longer available to order online. Visit a branch.</p>
    </div>
  </div>
</main>
</body>
</html>
